<style>
:root { --ink:#1b1b1b; --ink2:#2b2622; --red:#c62828; --red2:#e53935; --gold:#f9a825; --gold2:#ffca28; --cream:#fff8e1;
  --bg:#f5f1ea; --card:#fff; --line:#ebe4d8; --muted:#7a7068; --green:#2e7d32; --greenBg:#e8f5e9; --amber:#e65100; --amberBg:#fff3e0;
  --blue:#1565c0; --blueBg:#e3f2fd; --redBg:#ffebee; --shadow:0 2px 10px rgba(40,25,10,.08); --safe:env(safe-area-inset-bottom,0px); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-feature-settings:'cv11','ss01'; }
h1,h2,h3,.fred { font-family:'Fredoka',system-ui,Arial,sans-serif; font-weight:600; margin:0; letter-spacing:.1px; }
button { font-family:'Fredoka',system-ui,Arial,sans-serif; font-weight:600; font-size:15px; border:0; border-radius:12px; padding:11px 16px; cursor:pointer;
  background:var(--ink); color:#fff; transition:transform .06s, opacity .15s; }
button:active { transform:scale(.97); } button:disabled { opacity:.45; }
button.red { background:var(--red); } button.gold { background:var(--gold); color:var(--ink); } button.green { background:var(--green); }
button.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); } button.small { padding:6px 11px; font-size:13px; border-radius:9px; }
button.block { width:100%; } button.link { background:none; color:var(--red); padding:4px 6px; }
input,select,textarea { width:100%; font-family:inherit; font-size:16px; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
input:focus,select:focus,textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(249,168,37,.2); }
textarea { min-height:70px; resize:vertical; }
label.l { display:block; font-size:12px; font-weight:800; color:var(--muted); margin:12px 2px 5px; text-transform:uppercase; letter-spacing:.5px; }
a { color:var(--red); }
/* shell */
#top { position:sticky; top:0; z-index:20; background:var(--ink); color:#fff; display:flex; align-items:center; gap:8px; padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px)); box-shadow:0 2px 12px rgba(0,0,0,.25); }
#top h1 { font-size:20px; color:var(--gold); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#top .back { background:none; font-size:22px; padding:2px 8px; color:#fff; }
#top .act { background:var(--red); padding:7px 12px; font-size:14px; }
#view { max-width:900px; margin:0 auto; padding:12px 12px calc(96px + var(--safe)); min-height:80vh; }
#tabs { position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--line); display:flex;
  justify-content:space-around; align-items:flex-end; padding:6px 4px calc(6px + var(--safe)); box-shadow:0 -4px 16px rgba(40,25,10,.08); }
#tabs button { background:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 8px;
  font-family:'Inter',Arial; font-weight:800; font-size:11px; min-width:62px; }
#tabs button .i { font-size:22px; line-height:24px; } #tabs button .i svg { display:block; margin:-2px auto 0; }
details.wn { border-top:1px solid var(--line); padding:8px 2px; } details.wn summary { cursor:pointer; list-style:none; font-size:15px; } details.wn summary::-webkit-details-marker { display:none; }
details.wn summary:before { content:'▸ '; color:var(--red); } details.wn[open] summary:before { content:'▾ '; }
#tabs button.on { color:var(--red); }
#tabs button.plus .i { background:var(--red); color:#fff; width:52px; height:52px; line-height:52px; border-radius:50%; font-size:30px;
  margin-top:-26px; box-shadow:0 6px 16px rgba(198,40,40,.4); border:4px solid #fff; font-family:Arial; }
/* pieces */
.card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
.sec { display:flex; align-items:center; gap:8px; margin:18px 4px 8px; }
.sec h2 { font-size:18px; flex:1; } .sec .n { background:var(--ink); color:var(--gold); border-radius:10px; padding:1px 8px; font-size:13px; font-family:'Fredoka'; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.tile { background:#fff; border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); cursor:pointer; position:relative; overflow:hidden; }
.tile .k { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.tile .v { font-family:'Fredoka'; font-size:26px; margin-top:2px; }
.tile.hot { background:linear-gradient(135deg,#c62828,#8e1b1b); color:#fff; } .tile.hot .k { color:#ffd6d6; }
.tile.gold { background:linear-gradient(135deg,#ffca28,#f9a825); } .tile.gold .k { color:#6b4b00; }
.tile.dark { background:linear-gradient(135deg,#2b2622,#1b1b1b); color:var(--gold); } .tile.dark .k { color:#bfb3a5; }
.tile .e { position:absolute; right:8px; bottom:0; font-size:34px; opacity:.18; }
.oc { background:#fff; border-radius:14px; padding:12px 12px 12px 16px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer; position:relative; border-left:6px solid #d7ccc8; }
.oc.late { border-left-color:var(--red); background:#fff7f7; } .oc.plat { box-shadow:inset 0 0 0 2px #ffcc80, var(--shadow); } .oc.today { border-left-color:var(--gold); background:#fffdf3; }
.oc .t1 { display:flex; gap:8px; align-items:baseline; } .oc .who { font-family:'Fredoka'; font-size:17px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.oc .amt { font-family:'Fredoka'; font-size:16px; } .oc .t2 { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:5px; font-size:13px; color:var(--muted); }
.sw { position:relative; display:inline-block; width:46px; height:26px; flex:none; } .sw input { opacity:0; width:0; height:0; } .sw span { position:absolute; inset:0; background:#ccc; border-radius:26px; transition:.2s; } .sw span:before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; } .sw input:checked + span { background:var(--green); } .sw input:checked + span:before { transform:translateX(20px); }
.pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:800; background:#f1ece4; color:#5d534b; white-space:nowrap; }
.pill.red { background:var(--redBg); color:var(--red); } .pill.green { background:var(--greenBg); color:var(--green); }
.pill.amber { background:var(--amberBg); color:var(--amber); } .pill.blue { background:var(--blueBg); color:var(--blue); } .pill.dark { background:var(--ink); color:var(--gold); }
.seg { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; } .seg::-webkit-scrollbar { display:none; }
.seg button { background:#fff; color:var(--ink); border:1.5px solid var(--line); padding:7px 13px; font-size:14px; border-radius:20px; white-space:nowrap; }
.seg button.on { background:var(--ink); color:var(--gold); border-color:var(--ink); }
.search { position:relative; margin-bottom:10px; } .search input { padding-left:38px; border-radius:14px; }
.search:before { content:'🔍'; position:absolute; left:12px; top:11px; font-size:16px; }
.list .row { display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
.list .row:last-child { border-bottom:0; } .list .row .m { flex:1; min-width:0; } .list .row .m b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.muted { color:var(--muted); font-size:13px; } .big { font-family:'Fredoka'; font-size:28px; }
.flex { display:flex; gap:8px; align-items:center; } .flex > .grow { flex:1; min-width:0; } .wrap { flex-wrap:wrap; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.banner { border-radius:12px; padding:10px 12px; margin:8px 0; font-weight:700; font-size:14px; }
.banner.warn { background:var(--redBg); color:var(--red); } .banner.ok { background:var(--greenBg); color:var(--green); }
.banner.info { background:var(--blueBg); color:var(--blue); } .banner.gold { background:var(--cream); color:#6b4b00; }
.empty { text-align:center; padding:30px 10px; color:var(--muted); } .empty .e { font-size:40px; }
table.t { width:100%; border-collapse:collapse; font-size:14px; } table.t th { text-align:left; font-size:12px; color:var(--muted); text-transform:uppercase; padding:6px 4px; border-bottom:2px solid var(--line); }
table.t td { padding:8px 4px; border-bottom:1px solid var(--line); } .r { text-align:right; } .c { text-align:center; }
.line { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line); }
.line:last-child { border-bottom:0; } .line .q { font-family:'Fredoka'; min-width:34px; font-size:16px; } .line .n { flex:1; min-width:0; }
.kids { margin-top:4px; font-size:13px; color:#6d4c41; line-height:1.55; } .design { margin-top:5px; background:var(--cream); border-radius:8px; padding:5px 8px; font-size:13px; }
.steps { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; } .steps button { flex:0 0 auto; background:#f1ece4; color:var(--ink); font-size:13px; padding:8px 11px; }
.steps button.on { background:var(--green); color:#fff; } .steps button.cur { background:var(--red); color:#fff; }
.qty { display:flex; align-items:center; gap:4px; } .qty button { width:36px; height:36px; padding:0; font-size:20px; border-radius:10px; font-family:Arial; }
.qty input { width:52px; text-align:center; padding:7px 4px; font-weight:800; }
.prow { display:flex; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--line); }
.prow .nm { flex:1; min-width:0; font-weight:700; font-size:14px; } .prow .pr { font-family:'Fredoka'; min-width:56px; text-align:right; }
.cat { font-family:'Fredoka'; background:var(--cream); border-left:5px solid var(--gold); padding:6px 10px; margin:12px 0 2px; border-radius:6px; }
.cart .cl { padding:10px 0; border-bottom:1px solid var(--line); } .cart .cl.plat { background:var(--cream); margin:0 -14px; padding:10px 14px; }
.cart .kid { padding:6px 0 6px 18px; font-size:14px; color:#6d4c41; border-bottom:1px dashed var(--line); }
.cart .price { width:88px; padding:7px 8px; font-size:15px; }
.tot { display:flex; justify-content:space-between; padding:4px 2px; } .tot.big { font-family:'Fredoka'; font-size:21px; border-top:2px solid var(--ink); margin-top:4px; padding-top:8px; }
.savebar { position:fixed; left:0; right:0; bottom:calc(70px + var(--safe)); z-index:25; padding:8px 12px; background:linear-gradient(transparent,var(--bg) 30%); }
.savebar > div { max-width:900px; margin:0 auto; display:flex; gap:8px; } .savebar button { flex:1; padding:14px; font-size:17px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
/* overlay sheets */
#ov { position:fixed; inset:0; background:rgba(20,12,6,.55); z-index:60; display:none; }
#sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg); border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto;
  transform:translateY(105%); transition:transform .22s ease; padding:6px 14px calc(18px + var(--safe)); max-width:900px; margin:0 auto; }
#sheet.open { transform:none; } #sheet .grab { width:44px; height:5px; border-radius:3px; background:#d7ccc8; margin:6px auto 10px; }
#sheet h2 { font-size:20px; margin-bottom:6px; }
#full { position:fixed; inset:0; z-index:62; background:var(--bg); display:none; flex-direction:column; }
#full.open { display:flex; } #full .fh { background:var(--ink); color:#fff; padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top,0px)); display:flex; gap:8px; align-items:center; }
#full .fh h1 { color:var(--gold); font-size:18px; flex:1; } #full .fb { flex:1; overflow-y:auto; padding:10px 12px 110px; max-width:900px; width:100%; margin:0 auto; }
#full .ff { position:absolute; left:0; right:0; bottom:0; padding:10px 12px calc(10px + var(--safe)); background:#fff; border-top:1px solid var(--line); display:flex; gap:8px; }
#full .ff button { flex:1; padding:14px; }
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + var(--safe)); z-index:90; background:var(--ink); color:#fff; padding:11px 18px;
  border-radius:14px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.3); display:none; max-width:92vw; text-align:center; }
#toast.warn { background:var(--red); } #toast.ok { background:var(--green); }

  animation:sp 1s linear infinite; filter:drop-shadow(0 1px 1.5px rgba(60,20,10,.35)); }
@keyframes sp { to { transform:rotate(360deg); } }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
.loading { text-align:center; padding:44px 20px; color:var(--muted); }
.loading .spinwrap { display:inline-block; animation:bob 1.3s ease-in-out infinite; }

.loading .lt { display:block; margin-top:12px; font-family:'Fredoka'; color:#8a4b32; font-size:15px; letter-spacing:.2px; }
.fill { background:var(--red); color:#fff; padding:9px 12px; border-radius:12px; margin-bottom:8px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }

.toggle { display:flex; align-items:center; gap:10px; padding:10px 2px; font-weight:700; } .toggle input { width:22px; height:22px; accent-color:var(--red); }

  align-items:center; justify-content:flex-start; padding:40px 18px; overflow-y:auto; }

  .dchips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

:root { --red:#d7191c; --red2:#ef3b2c; --gold:#f7a823; --gold2:#ffc94a; --ink:#0d0b0a; }

#top { background:#0b0908; border-bottom:3px solid transparent; border-image:linear-gradient(90deg,#b5121b,#f7a823 30%,#ffd56a 50%,#f7a823 70%,#b5121b) 1; }

.hot-card { border:2px solid #c8e6c9; }

#topBiz .ver { text-transform:none; letter-spacing:0; font-weight:600; color:#9e8f7a; margin-left:4px; }
.medal { position:relative; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex:none;

<script>

  b = b || { biz: "Jack's Beef Shack", names: [], app: JBS_EXEC, version: "3.4", changes: [], howto: [] };
  var q = new URLSearchParams(location.search); b.go = q.get('go') || ''; b.goArg = q.get('arg') || null; b.who = q.get('who') || '';

/* ===== 💲 QUOTE MATH (shared: the server AND the app use this exact code) =====
 * From Jack's "JBS Pricing & Quote Dashboard":
 *  meat bought   = whole buy units of raw meat (finished oz ÷ yield), optional safety round-up to a full batch
 *  ingredients   = raw lb × ingredients $/raw lb
 *  batches       = buy lb ÷ batch lb (up) · runs = batches ÷ machines (up)
 *  time          = (runs × dry hrs + runs × production hrs + assembly min) × time cost/hr
 *  time cost/hr  = labor $/hr + (rent + electric + other) ÷ clock hours in a month
 *  total cost    = meat + ingredients + time + bag packing + platter setup + delivery you pay
 *  customer total= qty × (price + delivery charge each)
 *  margin health = vs the sale type floors (Could / Healthy / Strong)                       */
function qcRate_(S) { var b = S.biz; return (Number(b.labor) || 0) + ((Number(b.rent) || 0) + (Number(b.electric) || 0) + (Number(b.other) || 0)) / (Number(b.clockHours) || 720); }
function qcProd_(S, name) { for (var i = 0; i < S.products.length; i++) if (S.products[i].name === name) return S.products[i]; return null; }
function qcItem_(S, name) { for (var i = 0; i < S.items.length; i++) if (S.items[i].name === name) return S.items[i]; return null; }
/** Raw lb needed per product for qty of an item: {product: rawLb} */
function qcNeeds_(S, item, qty) {
  var out = {}, rec = S.recipes[item] || [];
  rec.forEach(function (r) {
    var p = qcProd_(S, r.product); if (!p || !(r.oz > 0)) return;
    var y = p.startRaw > 0 && p.finished > 0 ? p.finished / p.startRaw : 1;
    out[r.product] = (out[r.product] || 0) + (qty * r.oz / 16) / y;
  });
  return out;
}
/** Buy + production for raw lb of one product. */
function qcMake_(S, p, rawLb) {
  var o = { rawLb: rawLb, finLb: 0, units: 0, buyLb: 0, meat: 0, ing: 0, batches: 0, runs: 0, dry: 0, prod: 0, rolls: 0, cases: 0 };
  if (!(rawLb > 0)) return o;
  var per = Number(p.rawPerUnit) || 1, batch = Number(p.startRaw) || 0, b = S.biz;
  var need = rawLb;
  if (b.roundUp && batch > 0) { var part = rawLb % batch; if (part > 0.0001 && part >= (Number(b.threshold) || 0)) need = Math.ceil(rawLb / batch) * batch; }
  o.units = Math.ceil(need / per - 1e-9); o.buyLb = o.units * per;
  o.finLb = p.startRaw > 0 ? rawLb * p.finished / p.startRaw : rawLb;
  o.meat = o.units * (Number(p.costPerUnit) || 0);
  o.ing = rawLb * (Number(p.ingPerLb) || 0);
  o.batches = batch > 0 ? Math.ceil(o.buyLb / batch - 1e-9) : 0;
  o.runs = o.batches ? Math.ceil(o.batches / (Number(b.machines) || 1) - 1e-9) : 0;
  o.dry = o.runs * (Number(p.dryHrs) || 0); o.prod = o.runs * (Number(p.prodHrs) || 0);
  if (p.lbPerRoll > 0) { o.rolls = Math.ceil(o.buyLb / p.lbPerRoll - 1e-9); if (p.rollsPerCase > 0) o.cases = Math.ceil(o.rolls / p.rollsPerCase - 1e-9); }
  return o;
}
function qcHealth_(S, type, m) {
  var f = S.types[type] || S.types['Retail / Direct'] || [0.5, 0.55, 0.65];
  var pct = function (x) { return (Math.round(x * 1000) / 10).toFixed(1) + '%'; };
  if (m >= f[2]) return { tag: 'Strong', text: 'Strong +' + pct(m - f[2]) };
  if (m >= f[1]) return { tag: 'Healthy', text: 'Healthy +' + pct(m - f[1]) };
  if (m >= f[0]) return { tag: 'Could', text: 'Could +' + pct(m - f[0]) + ' (healthy needs ' + pct(f[1]) + ')' };
  return { tag: 'Low', text: 'Low — ' + pct(f[1] - m) + ' higher needed' };
}
/** One quote line → every number on the row. L = {item, qty, price, delCharge, delPaid, depositPct, saleType} */
function qcLine_(S, L) {
  var qty = Number(L.qty) || 0, it = qcItem_(S, L.item) || { sell: 0, pack: 0, setup: 0, minutes: 0 };
  var price = L.price === '' || L.price == null ? Number(it.sell) || 0 : Number(L.price) || 0;
  var needs = qcNeeds_(S, L.item, qty), r = { meat: 0, ing: 0, dry: 0, prod: 0, parts: [] };
  Object.keys(needs).forEach(function (n) { var m = qcMake_(S, qcProd_(S, n), needs[n]); r.meat += m.meat; r.ing += m.ing; r.dry += m.dry; r.prod += m.prod; m.product = n; r.parts.push(m); });
  var platHrs = qty * (Number(it.minutes) || 0) / 60, hrs = r.dry + r.prod + platHrs, rate = qcRate_(S);
  var pack = qty * (Number(it.pack) || 0), setup = qty * (Number(it.setup) || 0), delPaid = Number(L.delPaid) || 0;
  var cost = r.meat + r.ing + hrs * rate + pack + setup + delPaid, total = qty * (price + (Number(L.delCharge) || 0));

  var dep = Number(L.depositPct) || 0; if (dep > 1) dep = dep / 100;
  return { qty: qty, price: price, total: total, cost: cost, costEach: qty ? cost / qty : 0, profit: profit, margin: margin,
           health: qcHealth_(S, L.saleType, margin), deposit: total * dep, meat: r.meat, ing: r.ing, time: hrs * rate, hours: hrs,
           dry: r.dry, prod: r.prod, platHrs: platHrs, pack: pack, setup: setup, delPaid: delPaid, parts: r.parts };
}
/** Many lines (e.g. all Submitted) → dashboard + buy plan, with meat rounded once per product (like the sheet). */
function qcBoard_(S, lines) {
  var raw = {}, out = { orders: 0, units: 0, revenue: 0, cost: 0, profit: 0, margin: 0, deposits: 0, dry: 0, prod: 0, platHrs: 0, hours: 0, timeCost: 0, batches: 0, runs: 0, plan: [] };
  var names = {}, pack = 0, setup = 0, delPaid = 0, meat = 0, ing = 0;

    var c = qcLine_(S, L), it = qcItem_(S, L.item) || {};
    names[L.order || L.id] = 1; out.units += c.qty; out.revenue += c.total; out.deposits += c.deposit;
    pack += c.pack; setup += c.setup; delPaid += c.delPaid; out.platHrs += c.platHrs;
    var n = qcNeeds_(S, L.item, c.qty); Object.keys(n).forEach(function (k) { raw[k] = (raw[k] || 0) + n[k]; });
  });

  S.products.forEach(function (p) {
    var m = qcMake_(S, p, raw[p.name] || 0);
    meat += m.meat; ing += m.ing; out.dry += m.dry; out.prod += m.prod; out.batches += m.batches; out.runs += m.runs;
    out.plan.push({ product: p.name, buy: m.units ? m.buyLb : 0, buyAs: p.buyAs || 'lb', units: m.units, finLb: m.finLb, finOz: m.finLb * 16, batches: m.batches, runs: m.runs, dry: m.dry, prod: m.prod, rolls: m.rolls, cases: m.cases, meat: m.meat });

var TOKEN = null, ME = null, STACK = [], CUR = null, BD = null;

function money0(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '-$' : '$') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function loadingHtml() {

}
var LOAD_T0 = 0, LOAD_TICK = null;
/** Loading screen with a live clock: "Opening Orders · 2.4 s (usually ~3 s)". */
function loading(el) {

    (q.sales ? '<div class="tiles">' + tile('Square today', money(q.sales.today), 'hot', '💳') + tile('Last 7 days', money(q.sales.week), '', '📅') + tile('Payments', q.sales.n, 'dark', '🧾') + '</div>' : '') +
    (q.error ? '<div class="banner warn">' + esc(q.error) + '</div>' : '') +
    ((q.locations || []).length > 1 ? '<label class="l">Which location?</label><div class="flex wrap" style="gap:6px">' + q.locations.map(function (x) {
